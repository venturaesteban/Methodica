# JVM heap para builds con Compose (el compilador Compose consume bastante memoria)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilitar AndroidX y deshabilitar Jetifier (no hay deps legacy en este proyecto)
android.useAndroidX=true
android.enableJetifier=false

# Evitar referencias transitivas de recursos entre módulos
android.nonTransitiveRClass=true

# Estilo de código Kotlin oficial
kotlin.code.style=official

# Builds paralelos y configuración cacheada para reducir tiempos
org.gradle.parallel=true
org.gradle.configuration-cache=true
